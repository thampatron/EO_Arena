<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EOArena Taxonomy Explorer</title>
<meta name="description" content="Filterable taxonomy of Earth observation tasks and datasets for benchmarking geospatial foundation models.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
aside.filters{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow-y:auto;padding-right:4px;scrollbar-width:thin}
.fgroup{margin-bottom:14px}
.fgroup > h3{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:6px 8px}
details.facet > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border-radius:8px;font-size:14.5px;font-weight:600}
details.facet > summary::-webkit-details-marker{display:none}
details.facet > summary:hover{background:var(--surface-2)}
details.facet > summary .n{font-size:11.5px;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 7px}
details.facet > summary .hy{font-size:11px;font-weight:600;color:var(--fg-3);border:1px dashed var(--line-2);border-radius:999px;padding:0 6px;margin-left:6px}
.opts{display:grid;gap:1px;padding:2px 0 8px}
.opt{display:flex;gap:9px;align-items:center;padding:4px 8px;border-radius:7px;font-size:14px;color:var(--fg-2);cursor:pointer}
.opt:hover{background:var(--surface-2)}
.opt input{accent-color:var(--accent);margin:0;width:15px;height:15px;flex:none}
.opt .lb{flex:1;min-width:0}
.opt .ct{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.opt.zero{opacity:.45}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.toolbar .sp{flex:1}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;min-height:0}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:3px 6px 3px 11px}
.pill button{border:0;background:none;cursor:pointer;color:var(--fg-2);font-size:15px;line-height:1;padding:0 4px}
.count{font-size:14px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.filters-btn{display:none}
.sheet-head{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .filters-btn{display:inline-block}
  aside.filters{position:fixed;inset:0;z-index:45;max-height:none;background:var(--bg);padding:0 20px 40px;transform:translateY(102%);transition:transform .25s}
  aside.filters.on{transform:none}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:16px 0 10px;z-index:1}
  .sheet-head b{font-family:var(--serif);font-size:22px;font-weight:500}
}
.mx-wrap{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:3px;font-size:13px}
table.mx th{font-weight:500;color:var(--fg-2);text-align:left;padding:4px 8px;font-size:12.5px}
table.mx thead th{vertical-align:bottom;min-width:72px;max-width:108px;line-height:1.25}
table.mx tbody th{white-space:nowrap}
td.cell{width:52px;height:36px;text-align:center;border-radius:8px;font-variant-numeric:tabular-nums;cursor:pointer}
td.cell.z{border:1px dashed var(--line-2);color:var(--fg-3);cursor:default}
.hm1{background:var(--h1)}.hm2{background:var(--h2)}.hm3{background:var(--h3)}.hm4{background:var(--h4);color:var(--h-on-dark)}.hm5{background:var(--h5);color:var(--h-on-dark)}
td.tot{color:var(--fg-3);text-align:center;font-variant-numeric:tabular-nums}
.mx-legend{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--fg-3);margin-bottom:10px}
.mx-legend i{width:22px;height:12px;border-radius:4px;display:inline-block}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:8px;z-index:50;max-width:300px}
.empty{padding:48px 20px;text-align:center;color:var(--fg-3)}
</style>
</head>
<body>
<main class="page">
  <section class="hero">
    <h1>Earth observation task taxonomy</h1>
    <p class="sub">Every labelled EO dataset we audited, tagged the same way, so you can compare across domains and see where benchmarks are missing.</p>
    <div class="stats" id="stats"></div>
  </section>

  <div class="shell">
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="sheet-head"><b>Filters</b><button class="btn" type="button" id="sheet-done">Done</button></div>
      <div id="facets"></div>
    </aside>
    <div>
      <div class="toolbar">
        <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search datasets" aria-label="Search datasets"></label>
        <button class="btn filters-btn" type="button" id="filters-open">Filters</button>
        <div class="seg" role="group" aria-label="View"><button type="button" id="v-list" aria-pressed="true">List</button><button type="button" id="v-mx" aria-pressed="false">Matrix</button></div>
        <span class="sp"></span>
        <label class="inl" id="grp-w">Group <select class="sel" id="grp"></select></label>
        <label class="inl" id="mxr-w" hidden>Rows <select class="sel" id="mxr"></select></label>
        <label class="inl" id="mxc-w" hidden>Columns <select class="sel" id="mxc"></select></label>
      </div>
      <div class="active" id="active"></div>
      <div class="toolbar" style="margin-bottom:8px"><span class="count" id="count"></span><span class="sp"></span><button class="btn ghost" type="button" id="csv">Download CSV</button></div>
      <div id="out"></div>
    </div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Dataset details" aria-hidden="true"><header><div id="d-head"></div><button class="x" type="button" id="d-close" aria-label="Close">×</button></header><div class="body" id="d-body"></div></aside>
<div class="tip" id="tip" hidden></div>

<script src="assets/site.js"></script>
<script>
const GROUPS=[["Where",["dom","sub"]],["Task",["task","unit","val","tmp"]],["Data",["sen","res"]],["Trust",["p","tier","use","covk"]],["Hypothesis",["ab"]]];
const OPEN=new Set(["dom","task","tmp","sen","tier"]);
const MULTI_SHORT={task:1,sen:1};
let V,F,DATA,DOMS;
const st={sel:{},q:"",view:"list",grp:"dom",mxr:"sub",mxc:"task"};
const $=id=>document.getElementById(id);
const lab=(k,v)=>F[k].values[v]??v;

(async function(){
  const [voc,raw,doms]=await loadJSON('vocabulary','datasets','domains');
  V=voc.facets; F=Object.fromEntries(V.map(f=>[f.key,f])); DOMS=doms;
  DATA=raw.map(r=>({...r,f:{...r.facets,dom:[r.domain],sub:[r.subdomain],use:[r.benchmark_suites.length>=2?'u2':r.benchmark_suites.length===1?'u1':'u0']}}));
  V.forEach(f=>st.sel[f.key]=new Set());
  readURL();
  const subs=doms.flatMap(d=>d.subdomains.filter(s=>s.code));
  const gaps=subs.filter(s=>s.status==='gap').length;
  $('stats').innerHTML=[[DATA.length,'datasets'],[subs.length,'subdomains'],[gaps,'subdomains with no benchmark task'],[V.length,'facets']].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  buildSelects(); render();
})();

function readURL(){const p=new URLSearchParams(location.search);
  V.forEach(f=>{const v=p.get(f.key);if(v)v.split(',').forEach(x=>{if(x in f.values)st.sel[f.key].add(x)})});
  st.q=p.get('q')||''; $('q').value=st.q;
  if(p.get('view')==='matrix')st.view='mx';
  ['grp','mxr','mxc'].forEach(k=>{const v=p.get(k);if(v&&F[v])st[k]=v;});}
function writeURL(){const p=new URLSearchParams();
  V.forEach(f=>{if(st.sel[f.key].size)p.set(f.key,[...st.sel[f.key]].join(','))});
  if(st.q)p.set('q',st.q); if(st.view==='mx'){p.set('view','matrix');p.set('mxr',st.mxr);p.set('mxc',st.mxc);} else if(st.grp!=='dom')p.set('grp',st.grp);
  const s=p.toString(); history.replaceState(null,'',s?'?'+s:location.pathname);}
const text=d=>(d.name+' '+d.task_description+' '+d.sensors_description+' '+d.geography+' '+d.subdomain).toLowerCase();
function match(d,skip){ if(st.q&&!text(d).includes(st.q.toLowerCase()))return false;
  return V.every(f=>{if(f.key===skip)return true;const s=st.sel[f.key];return !s.size||d.f[f.key].some(v=>s.has(v));});}

function renderFacets(){
  $('facets').innerHTML=GROUPS.map(([g,keys])=>`<div class="fgroup"><h3>${g}</h3>${keys.map(k=>{const f=F[k];const pool=DATA.filter(d=>match(d,k));const n=st.sel[k].size;
    const was=document.querySelector(`details.facet[data-k="${k}"]`);const open=was?was.open:(OPEN.has(k)||n>0);
    return `<details class="facet" data-k="${k}" ${open?'open':''}><summary><span>${f.name}${f.hypothesis?'<span class="hy">hypothesis</span>':''}</span>${n?`<span class="n">${n}</span>`:''}</summary><div class="opts">${Object.entries(f.values).map(([v,l])=>{const c=pool.filter(d=>d.f[k].includes(v)).length;const on=st.sel[k].has(v);
      return `<label class="opt${!c&&!on?' zero':''}"><input type="checkbox" data-k="${k}" data-v="${esc(v)}" ${on?'checked':''}><span class="lb">${esc(l)}</span><span class="ct">${c}</span></label>`}).join('')}</div></details>`}).join('')}</div>`).join('');}
function renderActive(){const p=[];V.forEach(f=>st.sel[f.key].forEach(v=>p.push(`<span class="pill">${esc(lab(f.key,v))}<button type="button" data-k="${f.key}" data-v="${esc(v)}" aria-label="Remove ${esc(lab(f.key,v))}">×</button></span>`)));
  $('active').innerHTML=p.length?p.join('')+'<button class="btn ghost" type="button" id="clear">Clear all</button>':'';}
function short(d,k,max){const v=d.f[k].map(x=>lab(k,x));return v.length>max?v.slice(0,max).join(', ')+` +${v.length-max}`:v.join(', ');}
function row(d,i){return `<button type="button" class="row" data-i="${i}"><span class="nm">${esc(d.name)}<small>${esc(d.subdomain)}</small></span><span class="c2">${short(d,'task',2)} · ${lab('tmp',d.f.tmp[0])}</span><span class="c3">${short(d,'sen',3)}</span><span>${tierChip(d.f.tier[0])}</span></button>`;}
function renderList(rows){const f=F[st.grp];const out=[];
  Object.keys(f.values).forEach(v=>{const r=rows.filter(d=>d.f[f.key].includes(v));if(r.length)out.push(`<div class="ghead"><b>${esc(lab(f.key,v))}</b><span>${r.length}</span></div><div class="list">${r.map(d=>row(d,DATA.indexOf(d))).join('')}</div>`)});
  $('out').innerHTML=out.join('')||'<p class="empty">No dataset matches. That combination is a gap in the audited data.</p>';}
function hm(n,max){if(!n)return'z';const r=n/max;return r>.8?'hm5':r>.6?'hm4':r>.4?'hm3':r>.2?'hm2':'hm1';}
function renderMatrix(rows){const R=F[st.mxr],C=F[st.mxc];const rv=Object.keys(R.values),cv=Object.keys(C.values);
  const cnt=(a,b)=>rows.filter(d=>d.f[R.key].includes(a)&&d.f[C.key].includes(b)).length;
  let max=1;rv.forEach(a=>cv.forEach(b=>max=Math.max(max,cnt(a,b))));
  $('out').innerHTML=`<div class="mx-legend"><span>Datasets per cell</span><i class="hm1"></i><i class="hm2"></i><i class="hm3"></i><i class="hm4"></i><i class="hm5"></i><span>1 → ${max}</span><span>· dashed = none · click a cell to list it</span></div>
  <div class="card mx-wrap"><table class="mx"><thead><tr><th></th>${cv.map(b=>`<th>${esc(lab(C.key,b))}</th>`).join('')}<th>All</th></tr></thead><tbody>${rv.map(a=>`<tr><th>${esc(lab(R.key,a))}</th>${cv.map(b=>{const n=cnt(a,b);return `<td class="cell ${hm(n,max)}" ${n?`tabindex="0" data-a="${esc(a)}" data-b="${esc(b)}"`:''} data-tip="${esc(lab(R.key,a))} × ${esc(lab(C.key,b))}: ${n}">${n||''}</td>`}).join('')}<td class="tot">${rows.filter(d=>d.f[R.key].includes(a)).length}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted" style="margin-top:10px">Multi-valued facets (task, sensor, resolution, ability) count a dataset in each of its values.</p>`;}
function buildSelects(){const o=cur=>V.map(f=>`<option value="${f.key}" ${f.key===cur?'selected':''}>${f.name}</option>`).join('');$('grp').innerHTML=o(st.grp);$('mxr').innerHTML=o(st.mxr);$('mxc').innerHTML=o(st.mxc);}
function render(){renderFacets();renderActive();const rows=DATA.filter(d=>match(d));
  $('count').textContent=`${rows.length} of ${DATA.length} datasets`;
  $('v-list').setAttribute('aria-pressed',st.view==='list');$('v-mx').setAttribute('aria-pressed',st.view==='mx');
  $('grp-w').hidden=st.view!=='list';$('mxr-w').hidden=$('mxc-w').hidden=st.view!=='mx';
  st.view==='list'?renderList(rows):renderMatrix(rows);writeURL();window._rows=rows;}

function openDrawer(i){const d=DATA[i];
  $('d-head').innerHTML=`<p class="small muted">${esc(d.subdomain)}</p><h2>${esc(d.name)}</h2>`;
  const tags=k=>d.f[k].map(v=>`<span class="tag${F[k].hypothesis?' hyp':''}">${esc(lab(k,v))}</span>`).join('');
  const rowsF=[["task","Task"],["unit","Output unit"],["val","Output value"],["tmp","Time"],["sen","Sensors"],["res","Resolution"],["p","Labels"],["covk","Coverage"],["ab","Ability (hypothesis)"]];
  $('d-body').innerHTML=`<p>${flag(d.task_description)}. ${flag(d.sensors_description)}.</p>
  <dl class="facet-grid"><dt>Geography</dt><dd>${flag(d.geography)}</dd><dt>Size</dt><dd>${flag(d.size)}</dd><dt>Licence</dt><dd>${tierChip(d.f.tier[0])} <span class="small muted">${flag(esc(d.licence))}</span></dd><dt>Benchmarks</dt><dd>${d.benchmark_suites.length?d.benchmark_suites.map(s=>`<span class="tag">${esc(s)}</span>`).join(''):'<span class="muted small">In no audited benchmark suite</span>'}</dd></dl>
  <dl class="facet-grid">${rowsF.map(([k,l])=>`<dt>${l}</dt><dd>${tags(k)}</dd>`).join('')}</dl>
  <div><p class="small muted" style="margin-bottom:6px">Sources</p>${d.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join(' &nbsp; ')}</div>
  <p class="small"><a href="domains.html#${encodeURIComponent(d.subdomain.split(' ')[0])}">See this subdomain in the domain audit →</a></p>`;
  $('drawer').classList.add('on');$('scrim').classList.add('on');$('drawer').setAttribute('aria-hidden','false');$('d-close').focus();}
function closeDrawer(){$('drawer').classList.remove('on');$('scrim').classList.remove('on');$('drawer').setAttribute('aria-hidden','true');}

document.addEventListener('change',e=>{const t=e.target;
  if(t.matches('input[type=checkbox][data-k]')){const s=st.sel[t.dataset.k];t.checked?s.add(t.dataset.v):s.delete(t.dataset.v);render();}
  if(['grp','mxr','mxc'].includes(t.id)){st[t.id]=t.value;render();}});
document.addEventListener('click',e=>{const t=e.target.closest('button,td.cell');if(!t)return;
  if(t.classList.contains('row')){openDrawer(+t.dataset.i);return;}
  if(t.id==='clear'){V.forEach(f=>st.sel[f.key].clear());st.q='';$('q').value='';render();return;}
  if(t.closest('#active')&&t.dataset.k){st.sel[t.dataset.k].delete(t.dataset.v);render();return;}
  if(t.id==='v-list'){st.view='list';render();return;} if(t.id==='v-mx'){st.view='mx';render();return;}
  if(t.id==='d-close'){closeDrawer();return;}
  if(t.id==='filters-open'){$('filters').classList.add('on');return;} if(t.id==='sheet-done'){$('filters').classList.remove('on');return;}
  if(t.id==='csv'){csv();return;}
  if(t.matches('td.cell[data-a]')){st.sel[st.mxr].add(t.dataset.a);st.sel[st.mxc].add(t.dataset.b);st.view='list';render();window.scrollTo({top:$('out').offsetTop-120});}});
$('scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('filters').classList.remove('on');}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('td.cell[data-a]')){e.preventDefault();e.target.click();}});
let qt;$('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value.trim();render();},150);});
const tip=$('tip');document.addEventListener('mouseover',e=>{const c=e.target.closest('td.cell');if(c){tip.textContent=c.dataset.tip;tip.hidden=false;}});
document.addEventListener('mousemove',e=>{if(!tip.hidden){tip.style.left=Math.min(e.clientX+14,innerWidth-310)+'px';tip.style.top=(e.clientY+14)+'px';}});
document.addEventListener('mouseout',e=>{if(e.target.closest('td.cell'))tip.hidden=true;});
function csv(){const cols=["name","domain","subdomain","task_description","sensors_description","geography","size","licence","benchmark_suites"];
  const fk=V.filter(f=>!['dom','sub'].includes(f.key));
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=[[...cols,...fk.map(f=>f.name),"source"].map(q).join(',')];
  window._rows.forEach(d=>lines.push([...cols.map(c=>Array.isArray(d[c])?d[c].join('; '):d[c]),...fk.map(f=>d.f[f.key].map(v=>lab(f.key,v)).join('; ')),d.sources[0]?.url||''].map(q).join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download='eoarena-datasets.csv';a.click();}
</script>
</body>
</html>
