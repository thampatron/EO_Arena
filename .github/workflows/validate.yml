name: Validate taxonomy data
on:
  pull_request:
    paths: ["data/**", "scripts/validate.py"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/validate.py"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
