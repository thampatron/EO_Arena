name: Validate taxonomy data
on:
  pull_request:
    paths: ["data/**", "scripts/**", "export/**"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "export/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
      - run: python3 scripts/export.py && git diff --exit-code export/ || (echo "Exports are out of date: run python3 scripts/export.py and commit." && exit 1)
